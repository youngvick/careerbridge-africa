<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerBridge Africa — Production Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

  <!-- TOP NAVIGATION -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 font-extrabold flex items-center justify-center">CB</div>
        <div>
          <h1 class="font-bold text-base tracking-tight">CareerBridge Africa</h1>
          <p class="text-[11px] text-slate-400">Verified Digital Workforce Infrastructure</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span id="connBadge" class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
          ● Online Sync Active
        </span>
        <button id="btnSignOut" onclick="handleSignOut()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- AUTHENTICATION GATE (SIGN UP / LOGIN WITH NDPA 2023 CONSENT) -->
    <section id="authSection" class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex border-b border-slate-200 mb-5">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 pb-2.5 text-sm font-semibold border-b-2 border-slate-900 text-slate-900">Sign In</button>
        <button id="tabSignup" onclick="switchAuthTab('signup')" class="flex-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-500">Create Account</button>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div id="signupFields" class="hidden space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
            <input type="text" id="fullName" placeholder="e.g. Chinedu Okafor" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Account Role</label>
            <select id="userRole" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white">
              <option value="learner">Learner / Candidate (Training & CareerScore™)</option>
              <option value="employer">Employer / Hiring Manager (Talent Portal)</option>
              <option value="assessor">Certified Technical Assessor (Grading Queue)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Company / Institution (Optional)</label>
            <input type="text" id="orgName" placeholder="e.g. Paystack / Unilag" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" />
        </div>

        <div id="ndpaBox" class="hidden bg-slate-50 p-3 rounded-lg border border-slate-200">
          <label class="flex items-start gap-2 text-xs text-slate-600 cursor-pointer">
            <input type="checkbox" id="ndpaConsent" class="mt-0.5 rounded border-slate-300" />
            <span>I explicitly consent to CareerBridge Africa processing my assessment records and portfolio data in accordance with the <strong>Nigeria Data Protection Act (NDPA) 2023</strong>.</span>
          </label>
        </div>

        <p id="authFeedback" class="text-xs text-rose-600 hidden"></p>

        <button type="submit" id="authSubmitBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm py-2.5 rounded-lg transition">
          Sign In to Platform
        </button>
      </form>
    </section>

    <!-- DASHBOARD CONTAINER (RENDERED AFTER AUTHENTICATION) -->
    <section id="dashboardSection" class="hidden space-y-6">
      <div class="bg-white rounded-xl border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-4">
        <div>
          <span id="roleBadge" class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded bg-amber-100 text-amber-900">LEARNER</span>
          <h2 id="welcomeHeading" class="text-xl font-bold mt-1">Welcome back</h2>
          <p class="text-xs text-slate-500">All transactions are VAT-exclusive per Table 2.5 pricing schedule (Pilot Scholarship Mode Active).</p>
        </div>
        <div id="kpiStrip" class="flex gap-4 text-right"></div>
      </div>

      <!-- ROLE-SPECIFIC WORKSPACE -->
      <div id="workspaceContent" class="grid grid-cols-1 lg:grid-cols-3 gap-6"></div>
    </section>

  </main>

  <script>
    // =========================================================================
    // 1. LIVE SUPABASE CONFIGURATION
    // =========================================================================
    const SUPABASE_URL = "https://mnzqwllkyepgxixtgafu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gO0gCmajqqHlq1l6H7yqfQ_duU8GmMB";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authMode = "login";
    let currentUser = null;
    let currentProfile = null;

    // Offline connectivity listener (Low-bandwidth PWA readiness)
    window.addEventListener("online", () => updateConnStatus(true));
    window.addEventListener("offline", () => updateConnStatus(false));

    function updateConnStatus(online) {
      const badge = document.getElementById("connBadge");
      if (online) {
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        badge.textContent = "● Online Sync Active";
        syncOfflineQueue();
      } else {
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";
        badge.textContent = "● Offline Mode (Local Queue)";
      }
    }

    function switchAuthTab(mode) {
      authMode = mode;
      const isSignup = mode === "signup";
      document.getElementById("signupFields").classList.toggle("hidden", !isSignup);
      document.getElementById("ndpaBox").classList.toggle("hidden", !isSignup);
      document.getElementById("authSubmitBtn").textContent = isSignup ? "Register & Record NDPA Consent" : "Sign In to Platform";
      document.getElementById("tabLogin").className = isSignup
        ? "flex-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-500"
        : "flex-1 pb-2.5 text-sm font-semibold border-b-2 border-slate-900 text-slate-900";
      document.getElementById("tabSignup").className = isSignup
        ? "flex-1 pb-2.5 text-sm font-semibold border-b-2 border-slate-900 text-slate-900"
        : "flex-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-500";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const feedback = document.getElementById("authFeedback");
      feedback.classList.add("hidden");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (authMode === "signup") {
        const fullName = document.getElementById("fullName").value.trim();
        const role = document.getElementById("userRole").value;
        const orgName = document.getElementById("orgName").value.trim();
        const consent = document.getElementById("ndpaConsent").checked;

        if (!consent) {
          feedback.textContent = "You must accept the NDPA 2023 data processing consent box to register.";
          feedback.classList.remove("hidden");
          return;
        }

        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          feedback.textContent = error.message;
          feedback.classList.remove("hidden");
          return;
        }

        if (data.user) {
          const { error: profileError } = await supabase.from("profiles").insert({
            id: data.user.id,
            full_name: fullName || email.split("@")[0],
            email,
            role,
            organization_name: orgName,
            ndpa_consent_accepted: true,
            ndpa_consent_timestamp: new Date().toISOString()
          });
          if (profileError) {
            feedback.textContent = "Profile setup error: " + profileError.message;
            feedback.classList.remove("hidden");
            return;
          }
          await loadUserSession(data.user);
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          feedback.textContent = error.message;
          feedback.classList.remove("hidden");
          return;
        }
        await loadUserSession(data.user);
      }
    }

    async function loadUserSession(user) {
      currentUser = user;
      const { data: profile } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

      currentProfile = profile;
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      document.getElementById("btnSignOut").classList.remove("hidden");
      document.getElementById("roleBadge").textContent = profile.role.toUpperCase();
      document.getElementById("welcomeHeading").textContent = `Welcome, ${profile.full_name}`;

      if (profile.role === "learner") renderLearnerWorkspace();
      else if (profile.role === "employer") renderEmployerWorkspace();
      else renderAssessorWorkspace();
    }

    async function handleSignOut() {
      await supabase.auth.signOut();
      location.reload();
    }

    // =========================================================================
    // 2. LEARNER WORKSPACE (PILOT ENROLMENT + OFFLINE SUBMISSION)
    // =========================================================================
    async function renderLearnerWorkspace() {
      const container = document.getElementById("workspaceContent");
      const { data: tracks } = await supabase.from("tracks").select("*").order("code");
      const { data: enrolments } = await supabase
        .from("enrolments")
        .select("*, tracks(*)")
        .eq("learner_id", currentUser.id);

      const { data: scores } = await supabase
        .from("careerscores")
        .select("*, tracks(title)")
        .eq("learner_id", currentUser.id);

      document.getElementById("kpiStrip").innerHTML = `
        <div class="bg-slate-50 px-3 py-2 rounded-lg border border-slate-200">
          <div class="text-[11px] text-slate-500">Enrolled Tracks</div>
          <div class="text-base font-bold">${enrolments?.length || 0}</div>
        </div>
        <div class="bg-slate-50 px-3 py-2 rounded-lg border border-slate-200">
          <div class="text-[11px] text-slate-500">Verified CareerScores</div>
          <div class="text-base font-bold text-emerald-700">${scores?.length || 0}</div>
        </div>
      `;

      const trackCards = (tracks || []).map(t => {
        const existing = (enrolments || []).find(e => e.track_id === t.id);
        return `
          <div class="border border-slate-200 rounded-xl p-4 flex flex-col justify-between bg-white">
            <div>
              <span class="text-[11px] font-mono text-slate-500">${t.code}</span>
              <h4 class="font-bold text-sm mt-0.5">${t.title}</h4>
              <p class="text-xs text-slate-600 mt-1">Standard Tuition: <strong>₦${Number(t.fee_ngn).toLocaleString()}</strong> (Pilot Waiver Active)</p>
            </div>
            <div class="mt-4">
              ${existing
                ? `<span class="inline-block text-xs font-semibold px-2.5 py-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">Status: ${existing.payment_status}</span>`
                : `<button onclick="enrolInPilotTrack('${t.id}', '${t.title}')" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2 rounded-lg">Enrol in Pilot Cohort</button>`
              }
            </div>
          </div>
        `;
      }).join("");

      const scoreCards = (scores || []).map(s => `
        <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-emerald-900">${s.tracks?.title}</span>
            <span class="text-lg font-extrabold text-emerald-700">${s.final_score} / 1000</span>
          </div>
          <p class="text-xs text-emerald-800 mt-1">${s.readiness_tier}</p>
          <p class="text-[11px] font-mono text-emerald-700 mt-2">Portfolio ID: ${s.portfolio_slug}</p>
        </div>
      `).join("") || `<p class="text-xs text-slate-500">No verified CareerScores yet. Complete a proctored capstone to generate your score.</p>`;

      container.innerHTML = `
        <div class="lg:col-span-2 space-y-4">
          <h3 class="font-bold text-base">Available Technical & Engineering Tracks (7 Pillars)</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${trackCards}</div>
        </div>
        <div class="space-y-4">
          <div class="bg-white p-5 rounded-xl border border-slate-200 space-y-3">
            <h3 class="font-bold text-sm">Verified CareerScore™ Credentials</h3>
            ${scoreCards}
          </div>
          <div class="bg-white p-5 rounded-xl border border-slate-200 space-y-3">
            <h3 class="font-bold text-sm">Submit Capstone Artifact (Offline-Ready)</h3>
            <select id="submitEnrolmentId" class="w-full text-xs border border-slate-300 rounded-lg p-2 bg-white">
              ${(enrolments || []).map(e => `<option value="${e.id}|${e.track_id}">${e.tracks?.title}</option>`).join("") || `<option value="">Enrol in a track first</option>`}
            </select>
            <input type="url" id="artifactLink" placeholder="GitHub Repo / Figma / Drive CAD Model URL" class="w-full text-xs border border-slate-300 rounded-lg p-2" />
            <input type="url" id="defenseLink" placeholder="10-Min Executive Defense Video URL" class="w-full text-xs border border-slate-300 rounded-lg p-2" />
            <button onclick="submitCapstoneArtifact()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs py-2 rounded-lg">
              Submit for Proctored Verification
            </button>
          </div>
        </div>
      `;
    }

    async function enrolInPilotTrack(trackId, trackTitle) {
      const { error } = await supabase.from("enrolments").upsert({
        learner_id: currentUser.id,
        track_id: trackId,
        funding_type: "scholarship",
        payment_status: "scholarship_approved",
        amount_paid_ngn: 0
      });

      if (error) {
        alert("Enrolment error: " + error.message);
        return;
      }

      alert(`Enrolled in ${trackTitle} under Pilot Access! You can now submit your capstone artifact.`);
      renderLearnerWorkspace();
    }

    async function submitCapstoneArtifact() {
      const val = document.getElementById("submitEnrolmentId").value;
      if (!val) return alert("Please enrol in a track first.");
      const [enrolmentId, trackId] = val.split("|");
      const artifactUrl = document.getElementById("artifactLink").value.trim();
      const defenseUrl = document.getElementById("defenseLink").value.trim();
      if (!artifactUrl) return alert("Please provide your capstone artifact link.");

      const payload = {
        enrolment_id: enrolmentId,
        learner_id: currentUser.id,
        track_id: trackId,
        artifact_storage_path: artifactUrl,
        defense_video_url: defenseUrl,
        offline_synced: !navigator.onLine
      };

      if (!navigator.onLine) {
        const queue = JSON.parse(localStorage.getItem("cb_offline_submissions") || "[]");
        queue.push(payload);
        localStorage.setItem("cb_offline_submissions", JSON.stringify(queue));
        return alert("You are offline. Submission saved locally and will auto-sync when connectivity returns!");
      }

      const { error } = await supabase.from("submissions").insert(payload);
      if (error) return alert(error.message);
      alert("Capstone submitted to blind dual-assessor queue!");
      renderLearnerWorkspace();
    }

    async function syncOfflineQueue() {
      if (!supabase || !currentUser) return;
      const queue = JSON.parse(localStorage.getItem("cb_offline_submissions") || "[]");
      if (queue.length === 0) return;
      for (const item of queue) {
        await supabase.from("submissions").insert(item);
      }
      localStorage.removeItem("cb_offline_submissions");
      alert(`Synced ${queue.length} offline capstone submission(s) to the cloud!`);
    }

    // =========================================================================
    // 3. EMPLOYER WORKSPACE (FILTER VERIFIED TALENT + SHORTLIST)
    // =========================================================================
    async function renderEmployerWorkspace() {
      const container = document.getElementById("workspaceContent");
      const { data: verifiedPool } = await supabase
        .from("careerscores")
        .select("*, profiles(full_name, email), tracks(title), submissions(artifact_storage_path, defense_video_url)")
        .order("final_score", { ascending: false });

      const cards = (verifiedPool || []).map(c => `
        <div class="bg-white p-5 rounded-xl border border-slate-200 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start gap-2">
              <div>
                <h4 class="font-bold text-sm">${c.profiles?.full_name}</h4>
                <p class="text-xs text-slate-500">${c.tracks?.title}</p>
              </div>
              <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-amber-400 font-extrabold text-xs">
                ${c.final_score}/1000
              </span>
            </div>
            <p class="text-xs text-emerald-700 font-semibold mt-2">${c.readiness_tier}</p>
            <div class="mt-3 flex gap-3 text-xs">
              <a href="${c.submissions?.artifact_storage_path}" target="_blank" class="text-blue-600 underline">Inspect Work Sample</a>
              ${c.submissions?.defense_video_url ? `<a href="${c.submissions.defense_video_url}" target="_blank" class="text-blue-600 underline">Watch Defense</a>` : ""}
            </div>
          </div>
          <button onclick="shortlistCandidate('${c.id}', '${c.learner_id}')" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2 rounded-lg">
            Shortlist for Interview
          </button>
        </div>
      `).join("") || `<p class="text-sm text-slate-500 col-span-3">No verified candidates published yet.</p>`;

      container.innerHTML = `
        <div class="lg:col-span-3 space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-base">Pre-Vetted Talent Pool (Proctored & Rubric-Verified)</h3>
            <span class="text-xs text-slate-500">Showing ${verifiedPool?.length || 0} verified candidates</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${cards}</div>
        </div>
      `;
    }

    async function shortlistCandidate(careerscoreId, learnerId) {
      const { error } = await supabase.from("employer_shortlists").insert({
        employer_id: currentUser.id,
        careerscore_id: careerscoreId,
        learner_id: learnerId,
        engagement_type: "portal_shortlist"
      });
      if (error) return alert(error.message);
      alert("Candidate added to your shortlist! Remember: placements are counted only after written employer confirmation within 90 days.");
    }

    // =========================================================================
    // 4. ASSESSOR WORKSPACE (BLIND DUAL-GRADING + AUTOMATIC IRR >= 0.70 CHECK)
    // =========================================================================
    async function renderAssessorWorkspace() {
      const container = document.getElementById("workspaceContent");
      const { data: queue } = await supabase
        .from("submissions")
        .select("*, tracks(title), assessments(*)")
        .in("status", ["queued_for_grading", "under_dual_review", "moderation_flagged"]);

      const items = (queue || []).map(sub => `
        <div class="bg-white p-5 rounded-xl border border-slate-200 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-mono bg-slate-100 px-2 py-0.5 rounded">Blind ID: ${sub.id.slice(0, 8)}</span>
            <span class="text-xs font-semibold text-amber-700">${sub.status}</span>
          </div>
          <h4 class="font-bold text-sm">${sub.tracks?.title}</h4>
          <a href="${sub.artifact_storage_path}" target="_blank" class="inline-block text-xs text-blue-600 underline">Open Anonymized Submission Artifact →</a>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <input type="number" id="score_${sub.id}" min="0" max="1000" placeholder="Composite Score (0-1000)" class="text-xs border border-slate-300 rounded-lg p-2" />
            <button onclick="submitBlindGrade('${sub.id}')" class="bg-slate-900 text-white text-xs font-semibold rounded-lg px-3 py-2">
              Submit Blind Grade
            </button>
          </div>
        </div>
      `).join("") || `<p class="text-sm text-slate-500 col-span-3">Grading queue is clear.</p>`;

      container.innerHTML = `
        <div class="lg:col-span-3 space-y-4">
          <h3 class="font-bold text-base">Blind Dual-Assessor Queue (IRR ≥ 0.70 Governance Gate)</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${items}</div>
        </div>
      `;
    }

    async function submitBlindGrade(submissionId) {
      const score = parseInt(document.getElementById(`score_${submissionId}`).value, 10);
      if (isNaN(score) || score < 0 || score > 1000) return alert("Enter a valid score between 0 and 1000.");

      const { data: existing } = await supabase
        .from("assessments")
        .select("*")
        .eq("submission_id", submissionId)
        .maybeSingle();

      if (!existing) {
        await supabase.from("assessments").insert({
          submission_id: submissionId,
          assessor_1_id: currentUser.id,
          assessor_1_total: score
        });
        await supabase.from("submissions").update({ status: "under_dual_review" }).eq("id", submissionId);
        alert("Assessor 1 grade recorded. Awaiting blind Assessor 2 review.");
      } else {
        if (existing.assessor_1_id === currentUser.id) {
          return alert("Conflict of interest: You already submitted Assessor 1 grade. A second independent assessor must grade.");
        }
        await supabase.from("assessments").update({
          assessor_2_id: currentUser.id,
          assessor_2_total: score
        }).eq("id", existing.id);
        alert("Assessor 2 grade recorded! Database trigger automatically evaluated IRR (>= 0.70) and published CareerScore if passed.");
      }
      renderAssessorWorkspace();
    }
  </script>
</body>
</html>
